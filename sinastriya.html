<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Liber Astrodum — Синастрия</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,5 61,39 95,39 68,61 79,95 50,75 21,95 32,61 5,39 39,39' fill='%23d4af37' stroke='%23b8860b' stroke-width='2'/></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+SC&family=Cormorant+Infant:ital,wght@0,400;0,600;1,400&family=Caveat&family=Uncial+Antiqua&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cormorant Infant', serif;
            min-height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.65)), url('/static/bg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #f0f0f0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { max-width: 700px; width: 100%; }
        .back-btn {
            background: none; border: 1px solid #d4af37; color: #d4af37;
            padding: 8px 20px; border-radius: 20px; cursor: pointer;
            font-family: 'Cormorant Infant', serif; font-size: 16px;
            margin-bottom: 15px; text-decoration: none; display: inline-block;
        }
        .card {
            background: rgba(30, 20, 10, 0.6);
            border: 1px solid #5a5a5a; border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }
        h1 {
            font-family: 'Uncial Antiqua', cursive;
            color: #d4af37;
            font-size: 2em;
            margin-bottom: 10px;
            text-align: center;
        }
        .subtitle {
            font-family: 'Caveat', cursive;
            color: #ccc;
            font-size: 1.2em;
            margin-bottom: 25px;
            text-align: center;
        }
        label {
            display: block;
            margin-top: 18px;
            color: #d4af37;
            font-size: 1.1em;
            font-family: 'Caveat', cursive;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            background: #1c1c1c;
            border: 1px solid #444;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            font-family: 'Cormorant Infant', serif;
        }
        button {
            background: linear-gradient(135deg, #b8860b, #d4af37);
            color: #1a1a1a;
            border: none;
            padding: 14px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 25px;
            width: 100%;
            font-family: 'Cormorant Infant', serif;
            text-transform: uppercase;
        }
        .result-block {
            margin-top: 25px;
            display: none;
        }
        .interpretation-block {
            margin: 18px 0;
            padding: 20px 22px;
            background: linear-gradient(135deg, rgba(35, 35, 35, 0.78), rgba(10, 10, 10, 0.58));
            border: 1px solid rgba(212, 175, 55, 0.20);
            border-left: 3px solid rgba(212, 175, 55, 0.55);
            border-radius: 10px;
        }
        .interpretation-block-title {
            margin-bottom: 13px;
            color: #d4af37;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding-bottom: 9px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.20);
        }
        .interpretation-block-text {
            color: #e4e4e4;
            line-height: 1.8;
        }
        .loading { text-align: center; color: #d4af37; margin-top: 20px; font-style: italic; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-btn">← Назад</a>
        <div class="card">
            <h1>☍ Синастрия</h1>
            <div class="subtitle">Связь двух карт</div>

            <label>Имя первого</label>
            <input type="text" id="name1" value="Он">

            <label>Дата рождения первого</label>
            <input type="date" id="date1" value="1991-02-14">

            <label>Имя второго</label>
            <input type="text" id="name2" value="Она">

            <label>Дата рождения второго</label>
            <input type="date" id="date2" value="1993-07-21">

            <button onclick="askSinastriya()">Сравнить</button>

            <div class="result-block" id="resultBlock"></div>
        </div>
    </div>

    <script>
        async function askSinastriya() {
            const name1 = document.getElementById('name1').value;
            const date1 = document.getElementById('date1').value;
            const name2 = document.getElementById('name2').value;
            const date2 = document.getElementById('date2').value;

            const resultBlock = document.getElementById('resultBlock');
            resultBlock.style.display = 'block';
            resultBlock.innerHTML = '<div class="loading">Звёзды сравнивают судьбы...</div>';

            const params = new URLSearchParams({
                name1: name1, date1: date1,
                name2: name2, date2: date2,
            });

            try {
                const response = await fetch('/api/v1/sinastriya?' + params.toString());
                const data = await response.json();

                if (data.error) {
                    resultBlock.innerHTML = `<p style="color:#c06050;">${data.error}</p>`;
                    return;
                }

                const text = data.interpretation || '';
                const sectionRegex = /\[SECTION:(SOULS|LOVE|PASSION|MIND|VERDICT)\]\s*/g;
                const sections = [];
                let match;
                while ((match = sectionRegex.exec(text)) !== null) {
                    sections.push({ key: match[1], start: sectionRegex.lastIndex, markerStart: match.index });
                }

                const titles = {
                    SOULS: 'Души двух',
                    LOVE: 'Как любят',
                    PASSION: 'Огонь',
                    MIND: 'Слово',
                    VERDICT: 'Итог',
                };

                let html = '';
                if (sections.length > 0) {
                    for (let i = 0; i < sections.length; i++) {
                        const s = sections[i];
                        const end = i + 1 < sections.length ? sections[i + 1].markerStart : text.length;
                        const body = text.slice(s.start, end).trim();
                        if (body) {
                            html += `
                                <div class="interpretation-block">
                                    <div class="interpretation-block-title">✦ ${titles[s.key] || s.key}</div>
                                    <div class="interpretation-block-text">${body.replace(/\n/g, '<br>')}</div>
                                </div>
                            `;
                        }
                    }
                } else {
                    html = `<div class="interpretation-block"><div class="interpretation-block-text">${text.replace(/\n/g, '<br>')}</div></div>`;
                }

                resultBlock.innerHTML = html;
            } catch (e) {
                resultBlock.innerHTML = `<p style="color:#c06050;">Ошибка: ${e.message}</p>`;
            }
        }
    </script>
</body>
</html>
