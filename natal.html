<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liber Astrodum — Натальная карта</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,5 61,39 95,39 68,61 79,95 50,75 21,95 32,61 5,39 39,39' fill='%23d4af37' stroke='%23b8860b' stroke-width='2'/></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:wght@400;600&family=Caveat&family=Uncial+Antiqua&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cormorant Infant', serif;
            min-height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('/static/bg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #f0f0f0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { max-width: 700px; width: 100%; }
        .card {
            background: rgba(30, 20, 10, 0.8);
            border: 1px solid #5a5a5a;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        label { display: block; margin-top: 15px; color: #d4af37; font-size: 1.1em; }
        input {
            width: 100%; padding: 10px; margin-top: 5px;
            background: #1c1c1c; border: 1px solid #444;
            border-radius: 8px; color: #fff; font-size: 16px;
        }
        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; }
        button {
            background: linear-gradient(135deg, #b8860b, #d4af37);
            color: #1a1a1a; border: none; padding: 14px 30px;
            font-size: 18px; border-radius: 10px; cursor: pointer;
            margin-top: 20px; width: 100%; font-weight: bold;
        }
        button:hover { transform: translateY(-2px); }
        .loading { text-align: center; color: #d4af37; margin-top: 20px; font-style: italic; }
        .interpretation-block {
            margin: 15px 0; padding: 20px;
            background: rgba(35, 35, 35, 0.8);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-left: 3px solid #d4af37;
            border-radius: 10px;
        }
        .interpretation-block-title {
            color: #d4af37; font-size: 1.1rem;
            margin-bottom: 10px; text-transform: uppercase;
        }
        .interpretation-block-text {
            color: #e4e4e4; line-height: 1.7;
        }
        .theme-btn {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid #d4af37; color: #d4af37;
            padding: 8px 16px; border-radius: 20px;
            cursor: pointer; margin: 5px; font-size: 14px;
        }
        .theme-btn:hover { background: rgba(212, 175, 55, 0.25); }
        table { width: 100%; border-collapse: collapse; margin: 10px 0; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #444; }
        th { color: #d4af37; }
        .back-btn {
            display: inline-block; margin-bottom: 15px;
            color: #d4af37; text-decoration: none;
            border: 1px solid #d4af37; padding: 8px 20px;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-btn">← Назад</a>
        
        <div class="card">
            <h2 style="color: #d4af37; text-align: center; margin-bottom: 20px;">☉ Натальная карта</h2>
            
            <div class="row">
                <div><label>Год</label><input type="number" id="natalYear" value="1991"></div>
                <div><label>Месяц</label><input type="number" id="natalMonth" value="2"></div>
                <div><label>День</label><input type="number" id="natalDay" value="14"></div>
            </div>
            <div class="row">
                <div><label>Час</label><input type="number" id="natalHour" value="6"></div>
                <div><label>Минуты</label><input type="number" id="natalMinute" value="55"></div>
            </div>
            <div>
                <label>Широта</label><input type="number" id="lat" value="50.45" step="0.01">
            </div>
            <div>
                <label>Долгота</label><input type="number" id="lon" value="30.52" step="0.01">
            </div>
            
            <button onclick="askNatal()">Построить карту</button>
        </div>
        
        <div id="result" style="display: none; margin-top: 20px;"></div>
    </div>

    <script>
        let natalPrompts = {};
        let natalThemes = {};

        async function askNatal() {
            const resultBlock = document.getElementById('result');
            resultBlock.style.display = 'block';
            resultBlock.innerHTML = '<div class="loading">Звёзды складывают узор...</div>';

            const params = new URLSearchParams({
                natal_year: document.getElementById('natalYear').value,
                natal_month: document.getElementById('natalMonth').value,
                natal_day: document.getElementById('natalDay').value,
                natal_hour: document.getElementById('natalHour').value || 12,
                natal_minute: document.getElementById('natalMinute').value || 0,
                lat: document.getElementById('lat').value,
                lon: document.getElementById('lon').value,
            });

            try {
                const response = await fetch('/api/v1/natal?' + params.toString());
                
                if (!response.ok) {
                    throw new Error('Ошибка сервера: ' + response.status);
                }
                
                const data = await response.json();
                
                natalPrompts = data.prompts || {};
                natalThemes = data.themes || {};

                const wheelHtml = data.wheel ? <div style="text-align:center;margin:20px 0;"></div> : '';

                // Планеты
                let planetsHtml = '<h3 style="color:#d4af37;">Планеты</h3><table>';
                planetsHtml += '<tr><th>Планета</th><th>Знак</th><th>Градус</th></tr>';
                for (const [name, info] of Object.entries(data.planets || {})) {
                    planetsHtml += <tr><td></td><td></td><td>°</td></tr>;
                }
                planetsHtml += '</table>';

                // Дома
                let housesHtml = '<h3 style="color:#d4af37;margin-top:15px;">Дома</h3><table>';
                housesHtml += '<tr><th>Дом</th><th>Знак</th><th>Градус</th></tr>';
                for (let i = 1; i <= 12; i++) {
                    const house = data.houses?.[i];
                    if (house) {
                        housesHtml += <tr><td></td><td></td><td>°</td></tr>;
                    }
                }
                housesHtml += '</table>';

                // Темы
                let themesHtml = '';
                if (Object.keys(natalThemes).length > 0) {
                    themesHtml = '<h3 style="color:#d4af37;margin-top:15px;">Темы</h3><div>';
                    for (const [key, info] of Object.entries(natalThemes)) {
                        themesHtml += <button class="theme-btn" onclick="generateTheme('')"> ()</button>;
                    }
                    themesHtml += '</div><div id="themeResult"></div>';
                }

                resultBlock.innerHTML = 
                    <div style="background:rgba(28,28,28,0.8);border:1px solid #444;border-radius:14px;padding:20px;">
                        <h2 style="color:#d4af37;text-align:center;">Результат</h2>
                        
                        
                        
                        <h3 style="color:#d4af37;margin-top:15px;">Интерпретация</h3>
                        <div class="interpretation-block">
                            <div class="interpretation-block-text"></div>
                        </div>
                        
                        <br>
                        <a href="/" class="back-btn">← В меню</a>
                    </div>
                ;
            } catch (e) {
                resultBlock.innerHTML = <p style="color:#d4af37;">Ошибка: </p>;
            }
        }

        async function generateTheme(themeKey) {
            const prompt = natalPrompts[themeKey];
            if (!prompt) { alert('Промпт не найден'); return; }

            const themeResult = document.getElementById('themeResult');
            themeResult.innerHTML = '<div class="loading">Генерация...</div>';

            try {
                const response = await fetch('/api/generate-from-prompt', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({prompt: prompt}),
                });

                if (!response.ok) {
                    throw new Error('Ошибка сервера: ' + response.status);
                }

                const data = await response.json();

                if (data.text) {
                    themeResult.innerHTML = 
                        <div class="interpretation-block">
                            <div class="interpretation-block-title">✦ </div>
                            <div class="interpretation-block-text"></div>
                        </div>
                    ;
                } else {
                    themeResult.innerHTML = '<p style="color:#d4af37;">Ошибка генерации</p>';
                }
            } catch (e) {
                themeResult.innerHTML = <p style="color:#d4af37;">Ошибка: </p>;
            }
        }
    </script>
</body>
</html>
