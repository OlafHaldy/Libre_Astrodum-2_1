<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Liber Astrodum — Натальная карта</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,5 61,39 95,39 68,61 79,95 50,75 21,95 32,61 5,39 39,39' fill='%23d4af37' stroke='%23b8860b' stroke-width='2'/></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+SC&family=Cormorant+Infant:ital,wght@0,400;0,600;1,400&family=Caveat&family=Uncial+Antiqua&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cormorant Infant', serif;
            min-height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.65)), url('/static/bg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #f0f0f0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }
        .container { max-width: 700px; width: 100%; }
        .back-btn {
            background: none; border: 1px solid #d4af37; color: #d4af37;
            padding: 8px 20px; border-radius: 20px; cursor: pointer;
            font-family: 'Cormorant Infant', serif; font-size: 16px; margin-bottom: 15px;
            transition: all 0.3s; display: inline-block; text-decoration: none;
        }
        .back-btn:hover { background: rgba(212, 175, 55, 0.1); }
        .card {
            background-image: url('/static/card_bg.jpg'); background-size: cover;
            background-color: rgba(30, 20, 10, 0.6); background-blend-mode: overlay;
            border: 1px solid #5a5a5a; border-radius: 20px; padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); backdrop-filter: blur(10px);
            flex: 1;
            min-width: 0;
        }
        label { display: block; margin-top: 18px; color: #256057; font-size: 1.2em; font-family: 'Caveat', cursive; }
        input { width: 100%; padding: 12px; margin-top: 6px; background: #1c1c1c; border: 1px solid #444; border-radius: 10px; color: #fff; font-size: 16px; font-family: 'Cormorant Infant', serif; }
        input:focus { outline: none; border-color: #b8860b; box-shadow: 0 0 10px rgba(184, 134, 11, 0.4); }
        .row { display: flex; gap: 12px; } .row > div { flex: 1; }
        button {
            background: linear-gradient(135deg, #b8860b, #d4af37); color: #1a1a1a;
            border: none; padding: 14px 30px; font-size: 18px; font-weight: bold;
            border-radius: 12px; cursor: pointer; margin-top: 25px; width: 100%;
            font-family: 'Cormorant Infant', serif; text-transform: uppercase;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(184, 134, 11, 0.5); }
        .loading { text-align: center; color: #d4af37; margin-top: 25px; font-style: italic; }
        .suggestions-dropdown {
            position: absolute; background: #1c1c1c; border: 1px solid #444; border-radius: 10px;
            width: 100%; max-height: 200px; overflow-y: auto; z-index: 1000; margin-top: 4px; display: none;
        }
        .suggestion-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #333; }
        .suggestion-item:hover { background: #2a2a2a; }
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(9, 10, 15, 0.95); display: none; justify-content: center;
            align-items: center; z-index: 1000; flex-direction: column;
        }
        #overlay .sign-emoji { font-size: 100px; animation: float 2s ease-in-out infinite; }
        #overlay .sign-name {
            font-family: 'Uncial Antiqua', cursive; font-size: 2em; color: #d4af37;
            margin-top: 15px; text-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .interpretation-block {
            position: relative;
            margin: 18px 0;
            padding: 20px 22px 22px 24px;
            background: linear-gradient(135deg, rgba(35, 35, 35, 0.78), rgba(10, 10, 10, 0.58));
            border: 1px solid rgba(212, 175, 55, 0.20);
            border-left: 3px solid rgba(212, 175, 55, 0.55);
            border-radius: 10px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.22);
            animation: fadeIn 0.5s ease;
        }
        .interpretation-block-title {
            margin-bottom: 13px;
            color: #d4af37;
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding-bottom: 9px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.20);
        }
        .interpretation-block-subtitle {
            color: #b8860b;
            font-size: 0.9rem;
            margin-bottom: 10px;
            font-style: italic;
        }
        .interpretation-block-text {
            color: #e4e4e4;
            font-size: 1rem;
            line-height: 1.8;
            text-align: left;
        }
                /* ===== АФОРИЗМ-ЭПИГРАФ ===== */
        .aphorism {
            font-family: 'Caveat', cursive;
            font-size: 1.25em;
            color: #c9a84c;
            font-style: italic;
            margin: 5px 0 15px 0;
            padding: 8px 15px;
            border-left: 3px solid rgba(212, 175, 55, 0.4);
            background: linear-gradient(90deg, rgba(212, 175, 55, 0.06), transparent);
            border-radius: 0 8px 8px 0;
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.2);
            letter-spacing: 0.02em;
        }

        .aphorism::before {
            content: '❧';
            margin-right: 8px;
            font-size: 1.1em;
            color: #b8860b;
            opacity: 0.7;
        }

        .aphorism-label {
            font-family: 'Cormorant Infant', serif;
            font-size: 0.7em;
            color: #b8860b;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.6;
            margin-bottom: 3px;
        }
        .error-modal {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #1c1c1c;
            border: 2px solid #d4af37;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            max-width: 380px;
            width: 90%;
            z-index: 1001;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
        }
        .error-modal p { color: #f0f0f0; font-size: 1.15em; line-height: 1.6; margin-bottom: 25px; }
        .error-modal button {
            background: none; border: 1px solid #b8860b; color: #d4af37;
            padding: 10px 25px; border-radius: 20px; cursor: pointer;
            font-family: 'Uncial Antiqua', cursive; font-size: 1em;
        }
        .overlay-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 1000; display: none;
        }

        /* ===== LAYOUT ===== */
        .natal-layout {
            display: flex;
            align-items: flex-start;
            gap: 25px;
            width: 100%;
        }
        #mysteryPortal {
            flex-shrink: 0;
            width: 80px;
            text-align: center;
            cursor: pointer;
            padding-top: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #mysteryPortal img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.3));
            display: block;
        }
        #mysteryPortal .hand-label {
            font-size: 10px;
            color: #d4af37;
            font-family: 'Cormorant Infant', serif;
            letter-spacing: 2px;
            margin-top: 6px;
        }

        /* ===== ТАБЛИЦЫ ===== */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0 20px 0;
        }
        table th {
            background: rgba(212, 175, 55, 0.08);
            color: #d4af37;
            font-weight: 600;
            padding: 10px 12px;
            text-align: left;
            border-bottom: 2px solid rgba(212, 175, 55, 0.3);
            font-size: 0.95rem;
        }
        table td {
            padding: 8px 12px;
            border-bottom: 1px solid rgba(68, 68, 68, 0.5);
            transition: background 0.2s;
            font-size: 1rem;
        }
        table tr:hover td {
            background: rgba(212, 175, 55, 0.05);
        }
        .planet-symbol {
            font-size: 1.3em;
            margin-right: 6px;
            color: #d4af37;
            display: inline-block;
        }
        .sign-symbol {
            font-size: 1.1em;
            margin-right: 4px;
            display: inline-block;
        }
        .aspect-symbol {
            font-size: 1.3em;
            color: #d4af37;
            margin: 0 4px;
        }

        /* ===== КНОПКИ ТЕМ ===== */
        .themes-block {
            margin-top: 25px;
            padding: 15px;
            background: rgba(30, 30, 30, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
        }
        .themes-title {
            color: #d4af37;
            font-size: 1.1rem;
            margin-bottom: 12px;
            font-weight: 600;
        }
        .theme-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .theme-btn {
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Cormorant Infant', serif;
            font-size: 14px;
            margin: 0;
            width: auto;
            text-transform: none;
            transition: all 0.3s ease;
            position: relative;
        }
        .theme-btn::before {
            content: '✦';
            margin-right: 5px;
            opacity: 0.5;
            font-size: 10px;
        }
        .theme-btn:hover {
            background: rgba(212, 175, 55, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }
        .theme-btn.active {
            background: rgba(212, 175, 55, 0.35);
            font-weight: 600;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }
        #themeResult {
            margin-top: 15px;
        }

        @media (max-width: 600px) {
            .natal-layout {
                flex-direction: column;
                align-items: center;
                gap: 15px;
            }
            #mysteryPortal {
                width: auto;
                padding-top: 0;
                flex-direction: row;
                gap: 10px;
            }
            #mysteryPortal img { width: 45px; height: 45px; }
            .card { padding: 20px; width: 100%; }
            .row { flex-direction: column; gap: 8px; }
            .interpretation-block { margin: 14px 0; padding: 16px; }
            .interpretation-block-title { font-size: 1rem; }
            .interpretation-block-text { font-size: 0.95rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-btn">← Назад</a>

        <div class="natal-layout">
            <div id="mysteryPortal">
                <img src="/static/mystery_hand.png" alt="Рука мистерий">
                <span class="hand-label">Clavis Signi</span>
            </div>

            <div class="card">
                <h3 style="color: #d4af37; font-family: 'Uncial Antiqua', cursive; text-align: center; margin-bottom: 20px;">☉ Натальная карта</h3>
                <div class="row">
                    <div><label>Год рождения</label><input type="number" id="natalYear" value="1991"></div>
                    <div><label>Месяц</label><input type="number" id="natalMonth" value="2"></div>
                    <div><label>День</label><input type="number" id="natalDay" value="14"></div>
                </div>
                <div class="row">
                    <div><label>Час рождения</label><input type="number" id="natalHour" value="6"></div>
                    <div><label>Минуты</label><input type="number" id="natalMinute" value="55"></div>
                </div>
                <div style="position: relative;">
                    <label>Место рождения</label>
                    <input type="text" id="birthCity" value="Дубно" placeholder="Начните вводить город...">
                    <div id="suggestions" class="suggestions-dropdown"></div>
                </div>
                <button onclick="askNatal()">Построить натальную карту</button>
            </div>
        </div>

        <div id="result" style="display: none; margin-top: 20px; width: 100%;"></div>
    </div>

    <div id="overlay">
        <div class="sign-emoji" id="signEmoji"></div>
        <div class="sign-name" id="signName"></div>
    </div>

    <div id="errorOverlay" class="overlay-bg" onclick="closeErrorModal()"></div>
    <div id="errorModal" class="error-modal">
        <p>Звёзды, как и астролог-мечтатель, любят покой. Позвольте ему отложить до завтра ваш запрос.</p>
        <button onclick="closeErrorModal()">Принимаю</button>
    </div>

    <script>
        
        let natalPrompts = {};
        let natalThemes = {};

        const THEME_NAMES_RU = {
              'career_under_constraint': 'Стезя под гнётом',
              'community_under_constraint': 'Община в оковах',
              'community_polarization': 'Раскол в кругу',
        };

        const signEmojis = {
            'Aries': '♈', 'Taurus': '♉', 'Gemini': '♊',
            'Cancer': '♋', 'Leo': '♌', 'Virgo': '♍',
            'Libra': '♎', 'Scorpio': '♏', 'Sagittarius': '♐',
            'Capricorn': '♑', 'Aquarius': '♒', 'Pisces': '♓'
        };
        const signNamesRu = {
            'Aries': 'Овен', 'Taurus': 'Телец', 'Gemini': 'Близнецы',
            'Cancer': 'Рак', 'Leo': 'Лев', 'Virgo': 'Дева',
            'Libra': 'Весы', 'Scorpio': 'Скорпион', 'Sagittarius': 'Стрелец',
            'Capricorn': 'Козерог', 'Aquarius': 'Водолей', 'Pisces': 'Рыбы'
        };
        const signMottos = {
            'Aries': '«Я — первый луч рассвета, пробуждающий мир к действию.»',
            'Taurus': '«Я — плодородная земля, что превращает семя в древо жизни.»',
            'Gemini': '«Я — мост между мирами, где слово обретает плоть.»',
            'Cancer': '«Я — колыбель души, хранящая память всех начал.»',
            'Leo': '«Я — свет, что зажигает другие светильники, не теряя себя.»',
            'Virgo': '«Я — служитель порядка, превращающий хаос в исцеление.»',
            'Libra': '«Я — точка равновесия, где встречаются свет и тень.»',
            'Scorpio': '«Я — пламя, сжигающее старое, чтобы из пепла восстало новое.»',
            'Sagittarius': '«Я — стрела, пущенная в бесконечность, ищущая истину.»',
            'Capricorn': '«Я — вершина, к которой ведут десять тысяч шагов.»',
            'Aquarius': '«Я — вода жизни, изливающаяся на жаждущее человечество.»',
            'Pisces': '«Я — океан, где растворяются все границы и рождается вера.»'
        };
        const signMottoAuthor = '— Алиса Бейли, «Эзотерическая астрология»';
        const THEME_NAMES_RU = {
    'career_under_constraint': 'Стезя под гнётом',
    'community_under_constraint': 'Община в оковах',
    'community_polarization': 'Раскол в кругу',
};

        function showOverlay(signKey) {
            const emoji = signEmojis[signKey] || '❓';
            const name = signNamesRu[signKey] || signKey;
            const motto = signMottos[signKey] || '';
            document.getElementById('signEmoji').innerHTML = emoji;
            document.getElementById('signName').textContent = name;
            const oldMotto = document.getElementById('signMotto');
            const oldAuthor = document.getElementById('signMottoAuthor');
            if (oldMotto) oldMotto.remove();
            if (oldAuthor) oldAuthor.remove();
            const mottoElement = document.createElement('div');
            mottoElement.id = 'signMotto';
            mottoElement.style.cssText = 'color: #d4af37; font-style: italic; font-size: 1.2em; margin-top: 15px; text-align: center; max-width: 450px; line-height: 1.5; text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);';
            mottoElement.textContent = motto;
            document.getElementById('overlay').appendChild(mottoElement);
            const authorElement = document.createElement('div');
            authorElement.id = 'signMottoAuthor';
            authorElement.style.cssText = 'color: #b8860b; font-size: 0.9em; margin-top: 8px; text-align: center; font-style: normal;';
            authorElement.textContent = signMottoAuthor;
            document.getElementById('overlay').appendChild(authorElement);
            document.getElementById('overlay').style.display = 'flex';
            setTimeout(() => { document.getElementById('overlay').style.display = 'none'; }, 10000);
        }

        function showErrorModal() {
            document.getElementById('errorOverlay').style.display = 'block';
            document.getElementById('errorModal').style.display = 'block';
        }

        function closeErrorModal() {
            document.getElementById('errorOverlay').style.display = 'none';
            document.getElementById('errorModal').style.display = 'none';
        }

        let birthLat = 50.4188, birthLon = 25.7456;

        const birthCityInput = document.getElementById('birthCity');
        const suggestionsBox = document.getElementById('suggestions');
        birthCityInput.addEventListener('input', function() {
            const query = this.value.trim();
            if (query.length < 2) { suggestionsBox.style.display = 'none'; return; }
            fetch(`/api/city-search?q=${encodeURIComponent(query)}`)
                .then(r => r.json())
                .then(data => {
                    suggestionsBox.innerHTML = '';
                    if (!data.length) {
                        suggestionsBox.innerHTML = '<div class="suggestion-item">Ничего не найдено</div>';
                        suggestionsBox.style.display = 'block';
                        return;
                    }
                    data.forEach(place => {
                        const div = document.createElement('div');
                        div.className = 'suggestion-item';
                        div.textContent = place.display_name;
                        div.addEventListener('click', function() {
                            birthLat = place.lat; birthLon = place.lon;
                            birthCityInput.value = place.display_name;
                            suggestionsBox.style.display = 'none';
                        });
                        suggestionsBox.appendChild(div);
                    });
                    suggestionsBox.style.display = 'block';
                });
        });
        document.addEventListener('click', function(e) {
            if (!birthCityInput.contains(e.target) && !suggestionsBox.contains(e.target)) {
                suggestionsBox.style.display = 'none';
            }
        });

        async function generateTheme(themeKey) {
            const prompt = natalPrompts[themeKey];
            if (!prompt) { alert('Промпт не найден'); return; }

            document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const themeResult = document.getElementById('themeResult');
            const themeName = THEME_NAMES_RU[themeKey] || natalThemes[themeKey]?.core_theme || themeKey;
            const themeStrength = natalThemes[themeKey]?.strength || 0;

            themeResult.innerHTML = `
                <div class="loading">
                    <span style="display:inline-block;animation:float 1.5s ease-in-out infinite;">✦</span>
                    Звёзды раскрывают: ${themeName}...
                </div>
            `;

            try {
                const response = await fetch('/api/generate-from-prompt', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({prompt: prompt}),
                });

                if (!response.ok) {
                    throw new Error('Ошибка сервера: ' + response.status);
                }

                const data = await response.json();

                if (data.text) {
                    let cleanText = data.text.replace(/\[SECTION:\w+\]\s*/g, '');
                    cleanText = cleanText.trim();

                    themeResult.innerHTML = `
                        <div class="interpretation-block">
                            <div class="interpretation-block-title">✦ ${themeName}</div>
                            <div class="interpretation-block-subtitle">Сила темы: ${themeStrength.toFixed(1)}</div>
                            <div class="interpretation-block-text">${cleanText.replace(/\n/g, '<br>')}</div>
                        </div>
                    `;
                } else if (data.error) {
                    themeResult.innerHTML = `<p style="color:#d4af37;">Ошибка: ${data.error}</p>`;
                } else {
                    themeResult.innerHTML = '<p style="color:#d4af37;">Ошибка генерации</p>';
                }
            } catch (e) {
                themeResult.innerHTML = `<p style="color:#d4af37;">Ошибка: ${e.message}</p>`;
            }
        }
        function formatAphorism(text) {
    const match = text.match(/Афоризм:\s*[«"]([^»"]+)[»"]/);
    
    if (match) {
        const aphorismText = match[1];
        const restText = text.replace(/Афоризм:\s*[«"][^»"]+[»"]\s*/g, '');
        
        return `
            <div class="aphorism-label">Эпиграф</div>
            <div class="aphorism">${aphorismText}</div>
            <div class="interpretation-block-text">${restText.replace(/\n/g, '<br>')}</div>
        `;
    }
    
    return `<div class="interpretation-block-text">${text.replace(/\n/g, '<br>')}</div>`;
}

        async function askNatal() {
            const planetNames = {
                Sun: 'Солнце', Moon: 'Луна', Mercury: 'Меркурий',
                Venus: 'Венера', Mars: 'Марс', Jupiter: 'Юпитер', Saturn: 'Сатурн'
            };
            const planetSymbols = {
                Sun: '☉', Moon: '☽', Mercury: '☿', Venus: '♀',
                Mars: '♂', Jupiter: '♃', Saturn: '♄'
            };
            const signNames = {
                Aries: 'Овен', Taurus: 'Телец', Gemini: 'Близнецы', Cancer: 'Рак',
                Leo: 'Лев', Virgo: 'Дева', Libra: 'Весы', Scorpio: 'Скорпион',
                Sagittarius: 'Стрелец', Capricorn: 'Козерог', Aquarius: 'Водолей', Pisces: 'Рыбы'
            };
            const aspectNames = {
                conjunction: 'соединение', opposition: 'оппозиция', square: 'квадрат',
                trine: 'тригон', sextile: 'секстиль', quincunx: 'квинконс'
            };
            const aspectSymbols = {
                conjunction: '☌', opposition: '☍', square: '□',
                trine: '△', sextile: '⚹', quincunx: '⚻'
            };

            const natalYear = document.getElementById('natalYear').value;
            const natalMonth = document.getElementById('natalMonth').value;
            const natalDay = document.getElementById('natalDay').value;
            const natalHour = document.getElementById('natalHour').value || 12;
            const natalMinute = document.getElementById('natalMinute').value || 0;

            const resultBlock = document.getElementById('result');
            document.querySelector('.natal-layout').style.display = 'none';
            resultBlock.style.display = 'block';
            resultBlock.innerHTML = '<div class="loading">Звёзды складывают узор...</div>';

            const params = new URLSearchParams({
                natal_year: natalYear, natal_month: natalMonth, natal_day: natalDay,
                natal_hour: natalHour, natal_minute: natalMinute,
                lat: birthLat, lon: birthLon
            });

            try {
                const response = await fetch('/api/v1/natal?' + params.toString());
                const data = await response.json();

                natalPrompts = data.prompts || {};
                natalThemes = data.themes || {};

                const sunSign = data.natal_sun_sign || 'Aquarius';
                showOverlay(sunSign);

                const wheelHtml = data.wheel ? `<div style="text-align:center;margin-bottom:20px;">${data.wheel}</div>` : '';

                let planetListHtml = '<h3 style="color:#d4af37;">Планеты в знаках</h3>';
                planetListHtml += '<table><tr><th>Планета</th><th>Знак</th><th>Градус</th></tr>';
                for (const [name, info] of Object.entries(data.planets || {})) {
                    const planet = planetNames[name] || name;
                    const symbol = planetSymbols[name] || '';
                    const sign = signNames[info.sign] || info.sign;
                    const signSymbol = signEmojis[info.sign] || '';
                    planetListHtml += `<tr><td><span class="planet-symbol">${symbol}</span>${planet}</td><td><span class="sign-symbol">${signSymbol}</span>${sign}</td><td>${info.degree}°</td></tr>`;
                }
                planetListHtml += '</table>';

                let houseListHtml = '<h3 style="color:#d4af37;margin-top:20px;">Дома</h3>';
                houseListHtml += '<table><tr><th>Дом</th><th>Знак</th><th>Градус</th></tr>';
                for (let i = 1; i <= 12; i++) {
                    const house = data.houses?.[i];
                    if (house) {
                        const sign = signNames[house.sign] || house.sign;
                        const signSymbol = signEmojis[house.sign] || '';
                        houseListHtml += `<tr><td>${i}</td><td><span class="sign-symbol">${signSymbol}</span>${sign}</td><td>${house.degree?.toFixed(2)}°</td></tr>`;
                    }
                }
                houseListHtml += '</table>';

                let aspectListHtml = '';
                if (data.aspects && data.aspects.length > 0) {
                    aspectListHtml = '<h3 style="color:#d4af37;margin-top:20px;">Аспекты</h3>';
                    aspectListHtml += '<table><tr><th>Планета 1</th><th>Аспект</th><th>Планета 2</th><th>Угол</th></tr>';
                    for (const aspect of data.aspects) {
                        const p1 = planetNames[aspect.planet1] || aspect.planet1;
                        const p2 = planetNames[aspect.planet2] || aspect.planet2;
                        const name = aspectNames[aspect.type] || aspect.type;
                        const symbol = aspectSymbols[aspect.type] || '';
                        aspectListHtml += `<tr><td>${p1}</td><td><span class="aspect-symbol">${symbol}</span>${name}</td><td>${p2}</td><td>${aspect.angle}°</td></tr>`;
                    }
                    aspectListHtml += '</table>';
                }

                const interpretationText = data.interpretation || '';
                let cleanInterpretation = interpretationText.replace(/\[SECTION:\w+\]\s*/g, '');
                cleanInterpretation = cleanInterpretation.trim();

                const sectionRegex = /\[SECTION:(MAIN|STRENGTHS|WEAKNESSES|PSYCHOLOGY|TENSION|HERMETIC|TRANSFORMATION|CONCLUSION)\]\s*/g;
                const interpretationSections = [];
                let match;
                while ((match = sectionRegex.exec(interpretationText)) !== null) {
                    interpretationSections.push({ key: match[1], start: sectionRegex.lastIndex, markerStart: match.index });
                }

                let interpretationHtml = '';
                if (interpretationSections.length > 0) {
                    const interpretationTitles = {
                        MAIN: 'Главная тема', STRENGTHS: 'Сильные стороны', WEAKNESSES: 'Слабые места',
                        PSYCHOLOGY: 'Психологический слой', TENSION: 'Внутреннее напряжение',
                        HERMETIC: 'Герметический смысл', TRANSFORMATION: 'Путь преобразования', CONCLUSION: 'Итог'
                    };
                    for (let i = 0; i < interpretationSections.length; i++) {
                        const section = interpretationSections[i];
                        const endPos = i + 1 < interpretationSections.length ? interpretationSections[i + 1].markerStart : interpretationText.length;
                        const sectionText = interpretationText.slice(section.start, endPos).trim();
                        if (sectionText) {
                            const title = interpretationTitles[section.key] || section.key;
                            interpretationHtml += `
                                <div class="interpretation-block">
                                    <div class="interpretation-block-title">✦ ${title}</div>
                                    ${formatAphorism(sectionText)}
                                </div>
                            `;
                        }
                    }
                } else {
                    interpretationHtml = `<div class="interpretation-block"><div class="interpretation-block-text">${cleanInterpretation.replace(/\n/g, '<br>')}</div></div>`;
                }

                let themesHtml = '';
                if (natalThemes && Object.keys(natalThemes).length > 0) {
                    themesHtml = `
                        <div class="themes-block">
                            <div class="themes-title">❧ Иные прочтения</div>
                            <div class="theme-buttons">
                    `;
                    for (const [themeKey, themeInfo] of Object.entries(natalThemes)) {
                        const themeName = THEME_NAMES_RU[themeKey] || themeInfo.core_theme || themeKey;
                        const strength = themeInfo.strength || 0;
                        themesHtml += `
                            <button class="theme-btn" onclick="generateTheme('${themeKey}')">
                                ${themeName}
                            </button>
                        `;
                    }
                    themesHtml += `
                            </div>
                            <div id="themeResult"></div>
                        </div>
                    `;
                }

                resultBlock.innerHTML = `
                    <div style="background: rgba(28, 28, 28, 0.8); border: 1px solid #444; border-radius: 14px; padding: 20px; backdrop-filter: blur(5px);">
                        <h3 style="color: #d4af37; font-family: 'Uncial Antiqua', cursive; margin-bottom: 15px;">☉ Натальная карта — Результат</h3>
                        ${wheelHtml}
                        ${planetListHtml}
                        ${houseListHtml}
                        ${aspectListHtml}
                        <h3 style="color: #d4af37; margin-top: 20px;">Интерпретация</h3>
                        ${interpretationHtml}
                        ${themesHtml}
                        <br>
                        <a href="/" class="back-btn">← В главное меню</a>
                    </div>
                `;
            } catch (e) {
                showErrorModal();
            }
        }

        document.getElementById('mysteryPortal').addEventListener('click', function() {
            window.location.href = '/key';
        });
    </script>
</body>
</html>
