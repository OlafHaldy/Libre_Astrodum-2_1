<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Liber Astrodum — Ключ к знаку</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,5 61,39 95,39 68,61 79,95 50,75 21,95 32,61 5,39 39,39' fill='%23d4af37' stroke='%23b8860b' stroke-width='2'/></svg>">
    
    <!-- Шрифты -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+SC&family=Cormorant+Infant:ital,wght@0,400;0,600;1,400&family=Caveat&family=Uncial+Antiqua&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        @font-face {
            font-family: 'Gibb Sans';
            src: url('/static/Gibb_Sans.otf') format('opentype');
            font-weight: 400;
            font-style: normal;
        }
    </style>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cormorant Infant', serif;
            min-height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.65)), url('/static/bg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #f0f0f0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { max-width: 800px; width: 100%; }
        .back-btn {
            background: none; border: 1px solid #d4af37; color: #d4af37;
            padding: 8px 20px; border-radius: 20px; cursor: pointer;
            font-family: 'Cormorant Infant', serif; font-size: 16px; margin-bottom: 15px;
            text-decoration: none; display: inline-block;
            transition: background 0.3s;
        }
        .back-btn:hover { background: rgba(212, 175, 55, 0.1); }
        
        .key-title {
            font-family: 'Cormorant SC', serif;
            font-size: 2.5em;
            color: #d4af37;
            text-align: center;
            margin-bottom: 10px;
        }
        .key-subtitle {
            font-family: 'Caveat', cursive;
            font-size: 1.3em;
            color: #ccc;
            text-align: center;
            margin-bottom: 20px;
        }
        
        /* ===== ПЕРЕКЛЮЧАТЕЛЬ РЕЖИМОВ ===== */
        .mode-switcher {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .mode-btn {
            background: none;
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 10px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Cormorant Infant', serif;
            font-size: 15px;
            transition: all 0.3s;
            letter-spacing: 1px;
        }
        .mode-btn:hover {
            background: rgba(212, 175, 55, 0.1);
            transform: translateY(-1px);
        }
        .mode-btn.active {
            background: rgba(212, 175, 55, 0.25);
            font-weight: 600;
            border-color: #d4af37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }
        
        .zodiac-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        .zodiac-item {
            cursor: pointer;
            text-align: center;
            transition: transform 0.3s;
        }
        .zodiac-item:hover { transform: scale(1.1); }
        .zodiac-item img {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }
        .zodiac-name {
            color: #d4af37;
            font-size: 0.95em;
            margin-top: 5px;
        }
        
        /* ===== ПЕРГАМЕНТ ===== */
        #parchmentContainer {
            display: none;
            margin: 30px auto 10px;
            max-width: 600px;
            width: 100%;
            position: relative;
            cursor: pointer;
        }
        #parchmentContainer > img {
            width: 100%;
            height: auto;
        }
        
        #parchmentContent {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            max-width: 400px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        #parchmentText {
            color: #502103;
            font-family: 'Gibb Sans', sans-serif;
            font-size: 1.6em;
            font-weight: 400;
            line-height: 1.5;
            max-width: 80%;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        
        #parchmentText {
            color: #502103;
            font-family: 'Gibb Sans', sans-serif;
            font-size: 2.0em;
            font-weight: 400;
            line-height: 1.5;
        }
        
        #parchmentSign img {
            width: 35px;
            height: 35px;
            object-fit: contain;
            opacity: 0.8;
        }
        
        /* ===== ПОДПИСЬ РЕЖИМА ===== */
        #modeLabel {
            text-align: center;
            margin-top: 12px;
            font-family: 'Caveat', cursive;
            font-size: 1.1em;
            color: #b8860b;
            letter-spacing: 1px;
        }
        
        /* ===== КНОПКА ПОДЕЛИТЬСЯ ===== */
        #shareWrapper {
            text-align: center;
            margin-top: 15px;
            position: relative;
            display: inline-block;
        }
        #shareToggle {
            background: none;
            border: 1px solid rgba(212, 175, 55, 0.4);
            color: #d4af37;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Cormorant Infant', serif;
            font-size: 13px;
            transition: all 0.3s;
        }
        #shareToggle:hover {
            background: rgba(212, 175, 55, 0.1);
            border-color: #d4af37;
        }
        #shareMenu {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-top: 8px;
            background: rgba(20, 20, 30, 0.95);
            border: 1px solid #2a2a40;
            border-radius: 12px;
            padding: 8px;
            display: none;
            flex-direction: column;
            gap: 4px;
            min-width: 160px;
            backdrop-filter: blur(10px);
            z-index: 100;
        }
        #shareMenu.show { display: flex; }
        #shareMenu button {
            background: none;
            border: none;
            color: #e4e4e4;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Cormorant Infant', serif;
            font-size: 14px;
            text-align: left;
        }
        #shareMenu button:hover {
            background: rgba(212, 175, 55, 0.15);
            color: #d4af37;
        }
        
        /* ===== МОДАЛЬНОЕ ОКНО ===== */
        #parchmentModal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
            cursor: pointer;
        }
        #parchmentModal .modal-content {
            position: relative;
            max-width: 650px;
            width: 90%;
            max-height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #parchmentModal .modal-content img {
            width: 100%;
            height: auto;
            max-height: 85vh;
            object-fit: contain;
        }
        #modalContent {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        #modalText {
            font-size: 1.5em;
            max-width: 70%;
            word-wrap: break-word;
            line-height: 1.4;
        }
        
        #modalSign img {
            width: 50px;
            height: 50px;
            object-fit: contain;
            opacity: 0.5;
        }
        #parchmentModal .close-hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #888;
            font-family: 'Cormorant Infant', serif;
            font-size: 14px;
            opacity: 0.6;
        }
        
        /* ===== АДАПТИВ ===== */
        @media (max-width: 600px) {
            .zodiac-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }
            .zodiac-item img { width: 60px; height: 60px; }
            .key-title { font-size: 2em; }
            .key-subtitle { font-size: 1.1em; }
            .mode-btn { font-size: 13px; padding: 8px 16px; }
            #parchmentText {
                font-size: 1.1em;
                max-width: 70%;
                line-height: 1.4;
            }
            #parchmentContent {
                width: 65%;
            }
            #modalText {
                font-size: 1.5em;
                max-width: 70%;
                word-wrap: break-word;
                line-height: 1.4;
            }
            #parchmentModal .modal-content { max-width: 95%; width: 95%; }
        }
                @media (max-width: 600px) {
            #parchmentContainer {
                max-width: 400px;
                margin: 20px auto;
            }
            #parchmentContainer img {
                max-height: 500px;
                object-fit: contain;
            }
            #parchmentContent {
                width: 65%;
            }
            #parchmentText {
                font-size: 1.1em;
                max-width: 70%;
                line-height: 1.4;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/natal" class="back-btn">← Назад</a>
        <div class="key-title">Clavis Signi</div>
        <div class="key-subtitle">Выберите свой знак</div>

        <!-- ===== ПЕРЕКЛЮЧАТЕЛЬ РЕЖИМОВ ===== -->
        <div class="mode-switcher">
            <button class="mode-btn active" id="modeSapientia" onclick="setMode('sapientia')">
                🔮 Sapientia Signi
            </button>
            <button class="mode-btn" id="modeRisus" onclick="setMode('risus')">
                😏 Risus Signi
            </button>
        </div>

        <div class="zodiac-grid" id="zodiacGrid"></div>

        <div id="parchmentContainer">
            <img src="/static/scrol1.png" alt="Пергамент">
            <div id="parchmentContent">
                <div id="parchmentTextWrapper">
                    <span id="parchmentText"></span>
                    <span id="parchmentSign"></span>
                </div>
            </div>
        </div>
        
        <div id="modeLabel"></div>

        <div id="shareWrapper" style="display: none; text-align: center; margin-top: 10px;">
            <button id="shareToggle" onclick="toggleShareMenu()">🔗 Поделиться</button>
            <div id="shareMenu">
                <button onclick="shareTelegram()">📨 Telegram</button>
                <button onclick="shareFacebook()">📘 Facebook</button>
                <button onclick="shareTwitter()">🐦 Twitter</button>
                <button onclick="copyLink()">🔗 Копировать</button>
            </div>
        </div>
    </div>

    <div id="parchmentModal">
        <div class="modal-content">
            <img src="/static/scrol1.png" alt="Пергамент">
            <div id="modalContent">
                <div id="modalText"></div>
                <div id="modalSign"></div>
            </div>
        </div>
        <div class="close-hint">✕ Нажмите в любом месте, чтобы закрыть</div>
    </div>

    <script>
        const zodiacSigns = [
            { name: 'Aries', ru: 'Овен', img: '/static/zodiac/aries.png' },
            { name: 'Taurus', ru: 'Телец', img: '/static/zodiac/taurus.png' },
            { name: 'Gemini', ru: 'Близнецы', img: '/static/zodiac/gemini.png' },
            { name: 'Cancer', ru: 'Рак', img: '/static/zodiac/cancer.png' },
            { name: 'Leo', ru: 'Лев', img: '/static/zodiac/leo.png' },
            { name: 'Virgo', ru: 'Дева', img: '/static/zodiac/virgo.png' },
            { name: 'Libra', ru: 'Весы', img: '/static/zodiac/libra.png' },
            { name: 'Scorpio', ru: 'Скорпион', img: '/static/zodiac/scorpio.png' },
            { name: 'Sagittarius', ru: 'Стрелец', img: '/static/zodiac/sagittarius.png' },
            { name: 'Capricorn', ru: 'Козерог', img: '/static/zodiac/capricorn.png' },
            { name: 'Aquarius', ru: 'Водолей', img: '/static/zodiac/aquarius.png' },
            { name: 'Pisces', ru: 'Рыбы', img: '/static/zodiac/pisces.png' }
        ];

        let currentSign = '';
        let currentMode = 'sapientia';

        const grid = document.getElementById('zodiacGrid');
        zodiacSigns.forEach(sign => {
            const item = document.createElement('div');
            item.className = 'zodiac-item';
            item.onclick = () => getAphorism(sign.name);
            item.innerHTML = `
                <img src="${sign.img}" alt="${sign.ru}">
                <div class="zodiac-name">${sign.ru}</div>
            `;
            grid.appendChild(item);
        });

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('modeSapientia').classList.toggle('active', mode === 'sapientia');
            document.getElementById('modeRisus').classList.toggle('active', mode === 'risus');
            
            if (currentSign) {
                getAphorism(currentSign);
            }
        }
        function splitAphorism(text) {
            const words = text.trim().split(/\s+/);
            if (words.length <= 6) return text;
            
            const lines = [];
            const wordsPerLine = Math.ceil(words.length / 2);
            
            for (let i = 0; i < words.length; i += wordsPerLine) {
                lines.push(words.slice(i, i + wordsPerLine).join(' '));
            }
            
            return lines.join('<br>');
        }
        async function getAphorism(sign) {
            const container = document.getElementById('parchmentContainer');
            const text = document.getElementById('parchmentText');
            const signEl = document.getElementById('parchmentSign');
            const gridEl = document.getElementById('zodiacGrid');
            const subtitle = document.querySelector('.key-subtitle');
            const shareWrapper = document.getElementById('shareWrapper');
            const modeLabel = document.getElementById('modeLabel');
            
            currentSign = sign;
            
            gridEl.style.display = 'none';
            subtitle.style.display = 'none';
            if (shareWrapper) shareWrapper.style.display = 'none';
            text.innerHTML = 'Загрузка...';
            signEl.innerHTML = '';
            container.style.display = 'block';
            
            modeLabel.textContent = currentMode === 'sapientia' ? '— Sapientia Signi —' : '— Risus Signi —';

            const endpoint = currentMode === 'sapientia' ? '/api/v1/key' : '/api/v1/key-risus';

            try {
                const response = await fetch(`${endpoint}?sign=${sign}`);
                const data = await response.json();
                const rawAphorism = data.aphorism || 'Сегодня звёзды говорят тихо.';
                text.innerHTML = splitAphorism(rawAphorism);
                
                const signData = zodiacSigns.find(s => s.name === sign);
                if (signData) {
                    const signIcon = document.createElement('img');
                    signIcon.src = signData.img;
                    signIcon.alt = signData.ru;
                    signEl.appendChild(signIcon);
                }
                
                if (shareWrapper) shareWrapper.style.display = 'inline-block';
            } catch (e) {
                text.innerHTML = 'Сегодня звёзды говорят тихо.';
            }
        }

        function toggleShareMenu() {
            document.getElementById('shareMenu').classList.toggle('show');
        }

        document.addEventListener('click', function(e) {
            const wrapper = document.getElementById('shareWrapper');
            const menu = document.getElementById('shareMenu');
            if (wrapper && menu && !wrapper.contains(e.target)) {
                menu.classList.remove('show');
            }
        });

        function getShareText() {
            const sign = document.querySelector('#parchmentSign img')?.alt || 'Знак';
            const text = document.getElementById('parchmentText').textContent;
            const signNamesRu = {
                'Aries': 'Овен', 'Taurus': 'Телец', 'Gemini': 'Близнецы',
                'Cancer': 'Рак', 'Leo': 'Лев', 'Virgo': 'Дева',
                'Libra': 'Весы', 'Scorpio': 'Скорпион', 'Sagittarius': 'Стрелец',
                'Capricorn': 'Козерог', 'Aquarius': 'Водолей', 'Pisces': 'Рыбы'
            };
            const signRu = signNamesRu[sign] || sign;
            return `«${text}»\n\n— ${signRu}, Liber Astrodum`;
        }

        function shareTelegram() {
            const text = getShareText();
            window.open(`https://t.me/share/url?url=${encodeURIComponent(window.location.href)}&text=${encodeURIComponent(text)}`, '_blank');
            closeShareMenu();
        }

        function shareFacebook() {
            const text = getShareText();
            window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.href)}&quote=${encodeURIComponent(text)}`, '_blank');
            closeShareMenu();
        }

        function shareTwitter() {
            const text = getShareText();
            window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(window.location.href)}`, '_blank');
            closeShareMenu();
        }

        function copyLink() {
            const text = getShareText() + '\n\n' + window.location.href;
            if (navigator.share) {
                navigator.share({ title: 'Ключ к знаку — Liber Astrodum', text: text, url: window.location.href });
            } else {
                navigator.clipboard.writeText(text).then(() => alert('✅ Афоризм скопирован!')).catch(() => {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    alert('✅ Афоризм скопирован!');
                });
            }
            closeShareMenu();
        }

        function closeShareMenu() {
            document.getElementById('shareMenu').classList.remove('show');
        }

        // ===== МОДАЛЬНОЕ ОКНО =====
        const parchmentContainer = document.getElementById('parchmentContainer');
        const modal = document.getElementById('parchmentModal');
        const modalText = document.getElementById('modalText');
        const modalSign = document.getElementById('modalSign');

        parchmentContainer.addEventListener('click', function() {
            const text = document.getElementById('parchmentText').textContent;
            const signImg = document.querySelector('#parchmentSign img');
            
            if (text && text !== 'Загрузка...' && text !== 'Выберите знак') {
                modalText.innerHTML = splitAphorism(text);
                modalSign.innerHTML = '';
                if (signImg) {
                    modalSign.appendChild(signImg.cloneNode(true));
                }
                modal.style.display = 'flex';
            }
        });

        modal.addEventListener('click', function() {
            modal.style.display = 'none';
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                modal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
